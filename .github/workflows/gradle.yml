name: Build BABA AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using SDK manager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Check Android files
        run: |
          pwd
          git branch --show-current
          git ls-tree -r --name-only HEAD | grep -i 'AndroidManifest.xml' || true
          ls -la app/src/main || true

            - name: Check and create AndroidManifest
  run: |
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="BABA AI"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:allowBackup="false">
                  <activity
                      android:name="com.babaai.app.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          ls -l app/src/main/AndroidManifest.xml

      - name: Build BABA AI APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
        
          
          

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BABA-AI-APK
          path: app/build/outputs/apk/debug/*.apk
